<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SurfsApp – Aufrufstatistik</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:980px;margin:0 auto;padding:1.5rem;color:#17202a}
    h1{margin:.2rem 0 1rem}form{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
    input,button,select{font:inherit;padding:.55rem .7rem}input{min-width:280px}
    #error{color:#a40000}#status{color:#557}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}
    .card{border:1px solid #ccd6df;border-radius:.7rem;padding:.9rem}.card b{display:block;font-size:1.8rem}
    svg{width:100%;height:300px;border:1px solid #ccd6df;border-radius:.7rem;background:#fafcfe}
    table{border-collapse:collapse;width:100%;margin-top:.8rem}th,td{border:1px solid #ccd6df;padding:.45rem;text-align:left}
  </style>
</head>
<body>
  <h1>Aufrufstatistik der Bedienungsanleitung</h1>
  <form id="login">
    <input id="token" type="password" autocomplete="current-password" placeholder="STATs-Zugangscode" aria-label="Statistik-Zugangscode">
    <select id="period" aria-label="Zeitraum">
      <option value="all">Gesamter Verlauf</option>
      <option value="365">365 Tage</option>
      <option value="90">90 Tage</option>
      <option value="30">30 Tage</option>
    </select>
    <button type="submit">Anzeigen</button>
  </form>
  <p id="error"></p>
  <p id="status"></p>
  <div class="cards">
    <div class="card">Aufrufe gesamt<b id="total">–</b></div>
    <div class="card">Erster erfasster Tag<b id="first">–</b></div>
  </div>
  <svg id="chart" role="img" aria-label="Aufrufe je Tag"></svg>
  <table>
    <thead><tr><th>Tag</th><th>Aufrufe</th></tr></thead>
    <tbody id="daily"></tbody>
  </table>
  <h2>Nach Uhr-Build</h2>
  <table>
    <thead><tr><th>Build</th><th>Aufrufe</th></tr></thead>
    <tbody id="builds"></tbody>
  </table>
  <h2>Nach Seite</h2>
  <table>
    <thead><tr><th>Seite</th><th>Aufrufe</th></tr></thead>
    <tbody id="pages"></tbody>
  </table>
  <script>
    const endpoint="https://garmin-abruf.andigreen.workers.dev/api/manual/stats";
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const $=id=>document.getElementById(id);
    function draw(rows){
      const svg=$("chart"), W=940,H=300,L=50,R=12,T=14,B=34;
      svg.setAttribute("viewBox","0 0 "+W+" "+H);
      if(!rows.length){svg.innerHTML="<text x='20' y='30'>Keine Daten</text>";return;}
      const max=Math.max(1,...rows.map(r=>+r.views));
      const x=i=>L+(rows.length===1?W-L-R: i*(W-L-R)/(rows.length-1));
      const y=v=>T+(H-T-B)*(1-v/max);
      let path="";
      rows.forEach((r,i)=>{path+=(i?"L":"M")+x(i).toFixed(1)+","+y(+r.views).toFixed(1)+" ";});
      const cols=["#0b5f8c","#83b4d4","#b9d7ea"];
      let html="<line x1='"+L+"' y1='"+(H-B)+"' x2='"+(W-R)+"' y2='"+(H-B)+"' stroke='#607080'/>";
      html+="<line x1='"+L+"' y1='"+T+"' x2='"+L+"' y2='"+(H-B)+"' stroke='#607080'/>";
      html+="<path d='"+path+"' fill='none' stroke='"+cols[0]+"' stroke-width='3'/>";
      rows.forEach((r,i)=>{if(i===0||i===rows.length-1||rows.length<25||i%Math.ceil(rows.length/12)===0){
        html+="<circle cx='"+x(i).toFixed(1)+"' cy='"+y(+r.views).toFixed(1)+"' r='3' fill='"+cols[0]+"'/>";
        html+="<text x='"+x(i).toFixed(1)+"' y='"+(H-8)+"' font-size='10' text-anchor='middle' fill='#607080'>"+esc(r.day.slice(5))+"</text>";
      }});
      html+="<text x='"+L+"' y='"+(T-3)+"' font-size='11' fill='#607080'>"+max+" Aufrufe</text>";
      svg.innerHTML=html;
    }
    async function load(){
      const token=$("token").value.trim(), period=$("period").value;
      $("error").textContent="";$("status").textContent="Lade…";
      if(!token){$("error").textContent="Bitte Statistik-Zugangscode eingeben.";return;}
      try{
        const r=await fetch(endpoint+"?days="+encodeURIComponent(period),{headers:{authorization:"Bearer "+token}});
        const j=await r.json();
        if(!r.ok)throw new Error(j.message||j.error||("HTTP "+r.status));
        sessionStorage.setItem("surfsappStatsToken",token);
        $("status").textContent="Gesamtdauer: "+(period==="all"?"alle gespeicherten Daten":period+" Tage")+" · Aktualisiert: "+new Date(j.generated).toLocaleString();
        $("total").textContent=j.total||0;$("first").textContent=j.perDay&&j.perDay.length?j.perDay[0].day:"–";
        $("daily").innerHTML=(j.perDay||[]).map(r=>"<tr><td>"+esc(r.day)+"</td><td>"+r.views+"</td></tr>").join("");
        $("builds").innerHTML=(j.perBuild||[]).map(r=>"<tr><td>"+esc(r.build)+"</td><td>"+r.views+"</td></tr>").join("");
        $("pages").innerHTML=(j.perPage||[]).map(r=>"<tr><td>"+esc(r.page)+"</td><td>"+r.views+"</td></tr>").join("");
        draw(j.perDay||[]);
      }catch(e){$("status").textContent="";$("error").textContent=String(e.message||e);}
    }
    $("login").addEventListener("submit",e=>{e.preventDefault();load();});
    const old=sessionStorage.getItem("surfsappStatsToken");if(old){$("token").value=old;load();}
  </script>
</body>
</html>
